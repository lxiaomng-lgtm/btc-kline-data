name: BTC multiframe shadow observations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiframe-shadow.yml'
      - 'scripts/btc_*.py'
      - 'scripts/research_paper_edge.py'
      - 'research/ops/external-heartbeat.json'
  workflow_run:
    workflows: ['Update BTC candles']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: btc-multiframe-shadow
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect only the current open paper slot
        id: gate
        run: python3 scripts/btc_ops.py --gate
      - name: Generate a new signal when the current slot needs one
        if: steps.gate.outputs.make_signal == 'true'
        id: signal
        continue-on-error: true
        run: python3 scripts/multiframe_btc.py --shadow-only
      - name: Publish the immutable current signal
        id: publish_signal
        continue-on-error: true
        run: bash scripts/btc_push.sh 'Publish BTC multiframe shadow signal' research/multiframe_shadow
      - name: Execute current or recoverable slot on a new quote
        if: steps.publish_signal.outcome == 'success'
        id: fill
        continue-on-error: true
        run: python3 scripts/research_paper_edge.py
      - name: Append one account record for the slot
        id: commit_fill
        continue-on-error: true
        run: bash scripts/btc_push.sh 'Append prospective BTC paper journal' research/paper_edge
      - name: Generate live data and daily operations reports
        env:
          SIGNAL_OUTCOME: ${{ steps.signal.outcome }}
          PUBLISH_SIGNAL_OUTCOME: ${{ steps.publish_signal.outcome }}
          FILL_OUTCOME: ${{ steps.fill.outcome }}
          COMMIT_FILL_OUTCOME: ${{ steps.commit_fill.outcome }}
        run: python3 scripts/btc_ops.py
      - name: Publish the shared daily interface
        run: bash scripts/btc_push.sh 'Publish BTC daily market and operations data' btc_daily.json research/ops/receipts research/ops/daily research/ops/forward_progress.json
      - name: Fail visibly if the paper sequence encountered a hard error
        if: steps.signal.outcome == 'failure' || steps.publish_signal.outcome == 'failure' || steps.fill.outcome == 'failure' || steps.commit_fill.outcome == 'failure'
        run: exit 1
