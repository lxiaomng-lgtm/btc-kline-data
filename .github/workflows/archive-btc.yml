name: Archive BTC history
on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-btc.yml'
      - 'scripts/archive_btc.py'
      - 'scripts/analyze_history.py'
      - 'scripts/backtest_baseline.py'
permissions:
  contents: write
concurrency:
  group: btc-history-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/archive_btc.py
      - run: python3 scripts/analyze_history.py
      - run: python3 scripts/backtest_baseline.py
      - name: Publish validated archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update validated BTC history'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
