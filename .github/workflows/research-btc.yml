name: BTC historical strategy research
on:
  workflow_dispatch:
    inputs:
      full_research:
        type: boolean
        default: false
        description: Explicitly run large historical analysis
  push:
    branches: [main, research-btc, research-mtf]
    paths:
      - '.github/workflows/research-btc.yml'
      - 'scripts/research_*.py'
      - 'scripts/multiframe_btc.py'
  workflow_run:
    workflows: ['Archive BTC history']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: btc-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Verify and update Bitstamp archive tail
        env:
          FULL_RESEARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.full_research }}
        run: |
          if [ "$FULL_RESEARCH" = true ]; then python3 scripts/research_prices.py
          else python3 scripts/research_prices.py --audit-only; fi
      - name: Synchronize ETF history and test divergence
        id: etf
        continue-on-error: true
        run: python3 scripts/research_etf.py
      - name: Collect and evaluate venue data
        id: derivatives
        continue-on-error: true
        run: python3 scripts/research_derivatives.py
      - name: Run daily, 3h and 45m strategy research
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_research }}
        id: multiframe
        continue-on-error: true
        env:
          DERIVATIVES_OUTCOME: ${{ steps.derivatives.outcome }}
        run: python3 scripts/multiframe_btc.py
      - name: Publish completed research outputs
        env:
          MULTIFRAME_OUTCOME: ${{ steps.multiframe.outcome }}
          ETF_OUTCOME: ${{ steps.etf.outcome }}
          DERIVATIVES_OUTCOME: ${{ steps.derivatives.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/prices.json research/bitstamp_tail_15m.csv
          if [ -f research/price_collection_audit.json ]; then git add research/price_collection_audit.json; fi
          if [ -d research/shadow_signals ]; then
            git add research/shadow_signals/
          fi
          if [ "$ETF_OUTCOME" = success ]; then
            git add research/etf.json research/etf_history.csv research/etf_observations/
          fi
          if [ "$DERIVATIVES_OUTCOME" = success ]; then
            git add research/market.json research/market_hourly.csv research/funding.csv research/funding_okx.csv research/liquidation_sample.json
          fi
          if [ "$MULTIFRAME_OUTCOME" = success ]; then
            git add research/multiframe/
            if [ -d research/multiframe_observations ]; then
              git add research/multiframe_observations/
            fi
          fi
          git restore --worktree -- research/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish BTC research results'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1
      - name: Flag data source failures
        if: steps.etf.outcome == 'failure' || steps.derivatives.outcome == 'failure' || steps.multiframe.outcome == 'failure'
        run: exit 1
