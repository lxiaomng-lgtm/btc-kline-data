name: BTC historical strategy research
on:
  workflow_dispatch:
  push:
    branches: [main, research-btc]
    paths:
      - '.github/workflows/research-btc.yml'
      - 'scripts/research_*.py'
  workflow_run:
    workflows: ['Archive BTC history']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: btc-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Verify Bitstamp and run causal backtests
        run: python3 scripts/research_prices.py
      - name: Synchronize ETF history and test divergence
        id: etf
        continue-on-error: true
        run: python3 scripts/research_etf.py
      - name: Collect and evaluate venue data
        id: derivatives
        continue-on-error: true
        run: python3 scripts/research_derivatives.py
      - name: Publish completed research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish BTC research results'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1
      - name: Flag data source failures
        if: steps.etf.outcome == 'failure' || steps.derivatives.outcome == 'failure'
        run: exit 1
